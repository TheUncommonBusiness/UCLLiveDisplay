<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uncommon Leaders · Selected presentation system</title><style>@font-face{font-family:Season;src:url('../fonts/season-regular.otf')}@font-face{font-family:Season;src:url('../fonts/season-italic.otf');font-style:italic}@font-face{font-family:UCLInter;src:url('fonts/inter-ucl-regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e9ede2;color:#192520;font-family:UCLInter,Arial,sans-serif}header{padding:40px 4vw}h1{font:54px Season;margin:12px 0}p{max-width:900px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:20px 4vw 60px}.grid a{color:inherit;text-decoration:none}.grid img{display:block;width:100%;aspect-ratio:16/9;background:#192520}.grid h2{font:26px Season;margin:12px 0}.grid span{font-size:13px}.render{width:1920px;height:1080px;overflow:hidden;background:#192520}.render #stage{position:relative;width:1920px;height:1080px}.scene-text{position:absolute}.toolbar{display:flex;gap:24px;padding:20px;background:#fdfff2}.toolbar a{color:inherit}.single #stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center}.single .viewport{position:relative;height:calc(100vh - 60px);overflow:hidden;background:#192520}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><script type="module">
import{PRESENTATION_SCENES,getPresentationScene}from'./scenes.js';import{buildPresentationScene}from'../../src/presentation-renderer.js';
const qs=new URLSearchParams(location.search),id=qs.get('scene');window.presentationData=PRESENTATION_SCENES;
if(id){const s=getPresentationScene(id);document.body.className=qs.has('render')?'render':'single';if(!qs.has('render')){const bar=document.createElement('div');bar.className='toolbar';bar.innerHTML='<a href="preview.html">← All layouts</a><span></span>';bar.querySelector('span').textContent=s.name;document.body.append(bar)}const wrap=document.createElement('div');wrap.className='viewport';const stage=document.createElement('div');stage.id='stage';wrap.append(stage);document.body.append(wrap);const preset={layout:'presentation',sceneId:id,fields:{...s.defaultFields},motion:qs.get('motion')||'still'};let rendered;window.renderPresentation=(fields={},motion=preset.motion)=>{rendered?.dispose();rendered=buildPresentationScene({...preset,fields:{...preset.fields,...fields},motion},{},{});stage.append(rendered.root);window.currentScene=rendered;return rendered};window.renderPresentation();const fit=()=>{rendered.fit();if(!qs.has('render'))stage.style.transform='translate(-50%,-50%) scale('+Math.min(wrap.clientWidth/1920,wrap.clientHeight/1080)+')';requestAnimationFrame(fit)};requestAnimationFrame(fit);
}else{const header=document.createElement('header');header.innerHTML='<small>UNCOMMON LEADERS LIVE / PRESENTATION SYSTEM</small><h1>One design system. Every stage.</h1><p>Modern Editorial for content. Big Type for the big ideas. Night Rodeo for section breaks. Each layout shares its geometry, editable fields, and background film with PowerPoint.</p>';document.body.append(header);const grid=document.createElement('div');grid.className='grid';for(const s of PRESENTATION_SCENES){const a=document.createElement('a');a.href='?scene='+s.id;const img=document.createElement('img');img.src='previews/'+s.id+'.jpg';img.alt=s.name;const h=document.createElement('h2');h.textContent=s.name;const label=document.createElement('span');label.textContent=s.style+' · '+s.editableFields.length+' editable fields';a.append(img,h,label);grid.append(a)}document.body.append(grid)}window.presentationReady=true;
</script></body></html>
