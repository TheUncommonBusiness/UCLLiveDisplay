<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>UCL · Stage Display</title><link rel="icon" href="assets/art/leaders-logo.svg"><link rel="stylesheet" href="stage.css"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{width:100vw;height:100vh}body.idle{cursor:none}#output-controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:8px;border:1px solid #ffffff30;background:#16221df5;color:#fdfff2;font:12px Inter,sans-serif;box-shadow:0 10px 40px #0005;z-index:20;transition:opacity .25s;max-width:95vw}body.idle #output-controls{opacity:0;pointer-events:none}#output-name{font-weight:600;white-space:nowrap}#output-controls button,#output-controls select{background:#f0fe91;color:#192520;border:0;border-radius:5px;font:12px Inter,sans-serif;padding:9px 11px;cursor:pointer}#output-controls select{background:#ffffff15;color:#fdfff2}#output-controls option{color:#192520}#output-hint{font-size:10px;color:#bbc7ae;white-space:nowrap}#output-controls button:focus-visible,#output-controls select:focus-visible{outline:3px solid #f0fe91;outline-offset:3px}.no-output{color:#fdfff2;font:24px Inter,sans-serif;text-align:center;position:absolute;inset:0;display:grid;place-content:center;padding:30px}@media(max-width:650px){#output-hint{display:none}#output-controls{gap:8px;padding:10px}#output-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;font-size:10px}}</style></head><body><main id="stage" class="stage-host" aria-label="Clean stage output"></main><div id="output-controls"><span id="output-name">Stage Display</span><select id="output-fit" aria-label="Output scaling"><option value="fit">Fit</option><option value="fill">Fill / crop</option><option value="stretch">Stretch</option></select><button id="fullscreen">Full screen [F]</button><button id="hide-controls">Hide [H]</button><a id="tab-fallback" target="_blank" rel="noopener" hidden style="color:#f0fe91;white-space:nowrap">Open as tab ↗</a><span id="output-hint">Move to your screen, then enter full screen.</span></div><script type="module" src="src/output.js"></script></body></html>
