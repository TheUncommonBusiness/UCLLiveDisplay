<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=3840,height=2160"><title>Quiet range · 4K background loop</title><script src="assets/gsap.min.js"></script><style>
@font-face{font-family:Inter;src:url('assets/inter.ttf');font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;background:#192520}#root{position:relative;width:3840px;height:2160px;overflow:hidden;color:#FDFFF2;font-family:Inter,sans-serif}.clip{position:absolute}.background{inset:0;background:#192520}.light{left:-300px;top:-250px;width:4400px;height:2700px;background:radial-gradient(ellipse at 79% 42%,#80977315,transparent 46%),radial-gradient(ellipse at 8% 30%,#526b4f0c,transparent 55%)}.logo{left:220px;top:210px;width:940px;height:302px;background:#F0FE91;mask:url('assets/leaders-logo.svg') center/contain no-repeat}.horse{left:1945px;top:575px;width:1710px;height:1140px;object-fit:contain;mix-blend-mode:screen;opacity:.84;transform-origin:50% 94%}.grass{color:#A8B79E;opacity:.45;transform-origin:50% 100%;width:360px;height:1320px;top:550px}.grass-left{left:-96px}.grass-right{right:-42px}.grass svg{width:100%;height:100%;overflow:visible}.star{color:#F0FE91;transform-origin:center;filter:drop-shadow(0 0 5px #f0fe9130)}.rule{left:200px;right:200px;top:1938px;height:2px;background:#FDFFF2;opacity:.22}.location{left:200px;top:2007px;height:42px;display:flex;align-items:center;gap:40px;font-size:36px;letter-spacing:3.2px}.location i{width:25px;height:25px;border-radius:50%;background:#F0FE91}.company{right:200px;top:2001px;width:680px;height:51px;background:#FDFFF2;mask:url('assets/company-wordmark.png') center/contain no-repeat}
</style></head><body><div id="root" data-composition-id="quiet-range-4k" data-width="3840" data-height="2160" data-start="0" data-duration="20" data-fps="30">
<div id="background" class="clip background" data-start="0" data-duration="20" data-track-index="0"></div>
<div id="light" class="clip light" data-layout-ignore data-start="0" data-duration="20" data-track-index="1"></div>
<img id="horse" class="clip horse" src="assets/horse.png" alt="Engraved ranch horse" data-start="0" data-duration="20" data-track-index="2">
<div id="grass-left" class="clip grass grass-left" data-layout-ignore data-start="0" data-duration="20" data-track-index="3"></div>
<div id="grass-right" class="clip grass grass-right" data-layout-ignore data-start="0" data-duration="20" data-track-index="4"></div>
<div id="logo" class="clip logo" role="img" aria-label="Uncommon Leaders" data-start="0" data-duration="20" data-track-index="5"></div>
<div id="rule" class="clip rule" data-start="0" data-duration="20" data-track-index="6"></div>
<div id="location" class="clip location" data-layout-ignore data-start="0" data-duration="20" data-track-index="7"><i></i><span>AUSTIN, TEXAS</span></div>
<div id="company" class="clip company" role="img" aria-label="The Uncommon Business" data-start="0" data-duration="20" data-track-index="8"></div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};
const rounded=n=>Number(n.toFixed(6));
function cycle(selector,value){const first=value(0);tl.set(selector,first,0);const keyframes=[];for(let i=1;i<=160;i++)keyframes.push({...value(i/8),duration:.125,ease:'none'});tl.to(selector,{keyframes,ease:'none'},0)}
function grassMarkup(){let paths='';for(const [bx,tipY,bow]of [[54,236,22],[72,330,-26],[40,300,16],[88,408,-18],[60,440,9],[30,470,-12],[100,360,-22]])paths+=`<path d="M${bx} 784C${bx} ${(784+tipY)/2} ${bx+bow} ${tipY+90} ${bx+bow} ${tipY}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`;for(const [bx,tipY,bow]of [[64,236,14],[90,330,-12],[40,400,11]]){const tx=bx+bow;paths+=`<path d="M${bx} 784Q${bx-2} 450 ${tx} ${tipY}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;for(let i=0;i<8;i++){const t=i/7;for(const angle of [-34,34])paths+=`<path transform="translate(${tx+(bx-tx)*t*.7} ${tipY+t*140}) rotate(${angle}) scale(${.85-.28*t})" d="M0 0C3.4 -4.2 3.4 -9.4 0 -13.5C-3.4 -9.4 -3.4 -4.2 0 0Z" fill="currentColor"/>`}}return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 800">'+paths+'</svg>'}
document.getElementById('grass-left').innerHTML=grassMarkup();document.getElementById('grass-right').innerHTML=grassMarkup();
cycle('#grass-left',t=>({rotation:rounded(2.5*Math.sin(2*Math.PI*t/10+.3))}));
cycle('#grass-right',t=>({scaleX:-1,rotation:rounded(2.1*Math.sin(2*Math.PI*t/20+2.2))}));
cycle('#horse',t=>{const wave=(1-Math.cos(2*Math.PI*t/10))/2;return {scaleY:rounded(1+.0035*wave),y:rounded(-5*wave),rotation:rounded(-.15+.3*wave)}});
cycle('#light',t=>({x:rounded(24*Math.sin(2*Math.PI*t/20)),y:rounded(10*Math.sin(2*Math.PI*t/20+.7))}));
const points=[{x:3460,y:285,size:76},{x:2570,y:330,size:28},{x:1750,y:219,size:34},{x:3200,y:1770,size:27},{x:2120,y:1775,size:22},{x:1450,y:250,size:15},{x:2890,y:200,size:16},{x:3660,y:900,size:19},{x:3680,y:1580,size:16}];
points.forEach((p,i)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.id='star-'+i;s.classList.add('clip','star');s.setAttribute('viewBox','0 0 50 50');s.setAttribute('aria-hidden','true');s.setAttribute('data-start','0');s.setAttribute('data-duration','20');s.setAttribute('data-track-index',String(9+i));s.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.size}px;height:${p.size}px`;s.innerHTML='<path d="M25 0Q28 22 50 25Q28 28 25 50Q22 28 0 25Q22 22 25 0Z" fill="currentColor"/>';document.getElementById('root').append(s);cycle(s,t=>{const wave=(1-Math.cos(2*Math.PI*t/[5,10,20][i%3]+i*.61803398875*Math.PI*2))/2;return {opacity:rounded(.16+.84*wave),scale:rounded(.72+.42*wave)}})});
window.__timelines['quiet-range-4k']=tl;window.seekHold=t=>tl.totalTime(t,false);
</script></body></html>
